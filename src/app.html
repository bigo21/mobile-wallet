<!doctype html>
<html lang="%paraglide.lang%" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<!-- Bump ?v= when the icons change: browsers cache favicons very aggressively -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico?v=2" sizes="48x48" />
		<link rel="icon" type="image/png" sizes="96x96" href="%sveltekit.assets%/favicon.png?v=2" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png?v=2" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest?v=2" />
		<meta name="theme-color" content="#013F55" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" for-dark-light-data-mode="for-light">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
